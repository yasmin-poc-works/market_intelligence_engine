[project]
name = "insightforge-api"
version = "0.1.0"
description = "InsightForge AI backend: multi-agent market intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sse-starlette>=2.1,<3.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.1.4",
    "qdrant-client>=1.19.1",
    "deepagents>=0.7.23",
    "langchain-groq>=1.1.3",
    "tiktoken>=0.14.0",
    "sentence-transformers>=6.1.0",
    "pyjwt>=2.15.1",
    "fpdf2>=2.8.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false

# CPU-only torch (no CUDA wheels): keeps installs and CI small
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
