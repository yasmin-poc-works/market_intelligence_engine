[project]
name = "insightforge-api"
version = "0.1.0"
description = "InsightForge AI backend: multi-agent market intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sse-starlette>=2.1,<3.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false
